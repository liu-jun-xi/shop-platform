name = "shop-platform"
main = "worker/src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Wrangler 4.45+ 会在 deploy 时自动创建尚未存在的 D1 / R2（无需先手写 database_id）
[assets]
directory = "./client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/uploads/*"]

[[d1_databases]]
binding = "DB"
database_name = "shop-db"
database_id = "e5ee1ef5-b26f-460c-82e2-2097c7706d2a"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "PRODUCTS_BUCKET"
bucket_name = "shop-products"

[[r2_buckets]]
binding = "USERS_BUCKET"
bucket_name = "shop-users"

[triggers]
crons = ["0 * * * *"]

[vars]
ENVIRONMENT = "production"

# After first deploy:
#   npx wrangler secret put JWT_SECRET
#   npm run db:migrate
